<!DOCTYPE html>
<html lang="ru">
<head>

          <div class="banner-text">
            <h2 data-i18n="cat.gifts"></h2>
            <p data-i18n="cat.gifts.d"></p>

<script src="assets/js/i18n.js"></script>
